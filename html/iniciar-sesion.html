<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión — Mundo Cartas</title>
    <link rel="stylesheet" href="../css/estilos.css" />
    <link rel="stylesheet" href="../css/usuarios.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Mundo Cartas</h1>
      <nav>
        <a href="calendario.html">Torneos</a>
        <a href="iniciar-sesion.html" aria-current="page">Iniciar sesión</a>
        <a href="crear-cuenta.html">Crear cuenta</a>
      </nav>
    </header>
    <main class="contenedor auth">
      <h2>Iniciar sesión</h2>
      <p>Entra para inscribirte y ver tu historial.</p>
      <form action="calendario.html" method="get">
        <div class="campo">
          <label for="correo">Correo electrónico</label
          ><input
            id="correo"
            name="correo"
            type="email"
            required
            autocomplete="email"
          />
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label
          ><input
            id="clave"
            name="clave"
            type="password"
            required
            autocomplete="current-password"
          />
        </div>
        <button class="btn btn-primario" type="submit">Ingresar</button>
        <p class="pie">
          ¿Aún no tienes cuenta? <a href="crear-cuenta.html">Crea una</a>
        </p>
      </form>
    </main>
  </body>
</html>
